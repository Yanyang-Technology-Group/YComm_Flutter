name: Release

# 版本编号格式（与 YComm_WebSite 保持一致）：
#   vYYYY.MM.DD.commits
# 其中 commits = 发布时点仓库的提交总数（git rev-list --count HEAD）
# 例如：v2026.09.19.9
#
# 触发方式：
#   1. push 到 main → 自动计算版本号，构建全平台产物并创建 GitHub Release
#   2. 手动运行（workflow_dispatch）→ 可用输入框强制指定版本，不填则自动计算
#
# 各平台版本号落点（已按 Flutter 3.47.4 的源码逐项核实）：
#   Android  versionName   = yyyy.mm.dd.commits（四段，Android 不限格式）
#            versionCode   = yyyymmdd * 100 + commits % 100（单调递增，< 2^31-1）
#   iOS      CFBundleShortVersionString = yyyy.mm.dd（Apple 只接受 1-3 段整数）
#   macOS    CFBundleShortVersionString = yyyy.mm.dd
#            CFBundleVersion            = commits
#   Windows  VERSIONINFO FILEVERSION    = yyyy,mm,dd,commits
#   Linux    generated_config.cmake     = yyyy.mm.dd+commits
#   Web      version.json               = yyyy.mm.dd+commits（只读 pubspec.yaml）
#   界面显示  统一用 --dart-define=YCOMM_VERSION=yyyy.mm.dd.commits

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '强制版本号（如 v2026.09.19.9，可省略 commits 只指定日期），留空则自动计算'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ── 1. 静态分析与测试 ─────────────────────────────────────────────────
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # ── 2. 解析版本号（所有构建任务共用） ─────────────────────────────────
  version:
    name: Resolve version
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      semver_version: ${{ steps.resolve.outputs.semver_version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: resolve
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          COMMITS="$(git rev-list --count HEAD)"
          TODAY="$(date -u +%Y.%m.%d)"

          # 允许带 v 前缀；允许省略 commits（此时用提交总数补齐）
          RAW="${FORCED_VERSION:-}"
          RAW="${RAW#v}"
          if [ -z "$RAW" ]; then
            RAW="${TODAY}.${COMMITS}"
          fi

          # 只接受 yyyy.mm.dd 或 yyyy.mm.dd.commits；年月日不要求补零
          if ! printf '%s' "$RAW" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then
            echo "::error::版本号必须形如 yyyy.mm.dd[.commits]，收到：${RAW}"
            exit 1
          fi

          IFS=. read -r YEAR MONTH DAY BUILD_NUMBER <<< "$RAW"
          BUILD_NUMBER="${BUILD_NUMBER:-$COMMITS}"

          # 归一化：月份/日期补零，与 YComm_WebSite 的 %m.%d 格式保持一致
          YEAR="$(printf '%04d' "$((10#$YEAR))")"
          MONTH="$(printf '%02d' "$((10#$MONTH))")"
          DAY="$(printf '%02d' "$((10#$DAY))")"
          BUILD_NUMBER="$((10#$BUILD_NUMBER))"

          APP_VERSION="${YEAR}.${MONTH}.${DAY}.${BUILD_NUMBER}"
          # pubspec.yaml / Apple / CMake 只接受 1-3 段整数
          SEMVER_VERSION="${YEAR}.${MONTH}.${DAY}"
          # Android versionCode：yyyymmdd * 100 + commits % 100
          # 单调递增；最大 2099123199，小于 Google Play 的 2100000000 上限（有效到 2099 年）。
          VERSION_CODE="$(( (10#$YEAR * 10000 + 10#$MONTH * 100 + 10#$DAY) * 100 + BUILD_NUMBER % 100 ))"
          TAG="v${APP_VERSION}"

          {
            echo "app_version=${APP_VERSION}"
            echo "semver_version=${SEMVER_VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "version_code=${VERSION_CODE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## YComm Flutter ${TAG}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | \`${APP_VERSION}\` |"
            echo "| 提交总数 | \`${COMMITS}\` |"
            echo "| Android versionCode | \`${VERSION_CODE}\` |"
            echo "| Apple / CMake 三段版本 | \`${SEMVER_VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Android：签名 Release APK + AAB ───────────────────────────────
  android:
    name: Android (APK + AAB)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SEMVER_VERSION: ${{ needs.version.outputs.semver_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inject version into pubspec.yaml
        run: dart tool/set_version.dart "${SEMVER_VERSION}+${BUILD_NUMBER}"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?缺少 Secrets.ANDROID_KEYSTORE_BASE64：Release 必须使用固定签名密钥，不会回退到调试签名}"
          : "${STORE_PASSWORD:?缺少 Secrets.ANDROID_STORE_PASSWORD}"
          : "${KEY_PASSWORD:?缺少 Secrets.ANDROID_KEY_PASSWORD}"
          : "${KEY_ALIAS:?缺少 Secrets.ANDROID_KEY_ALIAS}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="$VERSION_CODE" \
            --dart-define=YCOMM_VERSION="$APP_VERSION"
      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$VERSION_CODE" \
            --dart-define=YCOMM_VERSION="$APP_VERSION"
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ycomm-android-${APP_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ycomm-android-${APP_VERSION}.aab"
          ls -l dist
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 4. iOS：未签名 IPA ────────────────────────────────────────────────
  # 构建未签名真机 .app，再按 Payload/*.app 结构打包；安装前需自行签名。
  ios:
    name: iOS (unsigned ipa)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SEMVER_VERSION: ${{ needs.version.outputs.semver_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inject version into pubspec.yaml
        run: dart tool/set_version.dart "${SEMVER_VERSION}+${BUILD_NUMBER}"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name="$SEMVER_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=YCOMM_VERSION="$APP_VERSION"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没有找到未签名真机应用：$APP"
            exit 1
          fi
          PACKAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$PACKAGE_DIR"' EXIT
          mkdir -p "$PACKAGE_DIR/Payload" dist
          cp -a "$APP" "$PACKAGE_DIR/Payload/Runner.app"
          IPA="$PWD/dist/ycomm-ios-${APP_VERSION}-unsigned.ipa"
          # 保留包内符号链接；从 Payload 的父目录打包，避免额外目录层级。
          (cd "$PACKAGE_DIR" && zip -q -r -y "$IPA" Payload)
          unzip -t "$IPA"
          ls -l "$IPA"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 5. macOS：签名（有证书时）+ .app + .dmg ───────────────────────────
  # 未配置 APPLE_CERT_P12_BASE64 时跳过签名，产物为未签名 .app / .dmg，
  # 用户首次打开需右键「打开」，详见 README 的发布者签名一节。
  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SEMVER_VERSION: ${{ needs.version.outputs.semver_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      APP_NAME: 晏阳社区
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inject version into pubspec.yaml
        run: dart tool/set_version.dart "${SEMVER_VERSION}+${BUILD_NUMBER}"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build macOS app
        run: |
          set -euo pipefail
          flutter build macos --release \
            --build-name="$SEMVER_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=YCOMM_VERSION="$APP_VERSION"
      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Sign macOS app
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          # 从内到外签名：先签嵌套的 framework/dylib，再签整个 .app。
          # 不用 --deep —— Apple 已不推荐，它不会用正确的 entitlements 重新签嵌套项。
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -depth \
              \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --options runtime --timestamp \
                --sign "$APPLE_SIGNING_IDENTITY" {} \;
          fi
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Collect artifacts
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::没有找到 .app"
            find build/macos/Build/Products -maxdepth 3 -type d
            exit 1
          fi
          echo "App: $APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/ycomm-macos-${APP_VERSION}.zip"
          ls -l dist
      - name: Build DMG
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          # 拖到「应用程序」即可安装
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/ycomm-macos-${APP_VERSION}.dmg"
          hdiutil verify "dist/ycomm-macos-${APP_VERSION}.dmg"
          ls -l dist
      - name: Notarize and staple DMG
        if: env.HAS_APPLE_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/ycomm-macos-${APP_VERSION}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Warn when unsigned
        if: env.HAS_APPLE_CERT != 'true'
        run: |
          echo "::warning::未配置 Apple 签名证书（APPLE_CERT_P12_BASE64），macOS 产物未签名，用户首次打开需右键「打开」。"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 6. Linux：桌面版 tar.gz ───────────────────────────────────────────
  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SEMVER_VERSION: ${{ needs.version.outputs.semver_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      APP_NAME: 晏阳社区
      APP_PUBLISHER: 晏阳技术组
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxi-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inject version into pubspec.yaml
        run: dart tool/set_version.dart "${SEMVER_VERSION}+${BUILD_NUMBER}"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Linux bundle
        run: |
          set -euo pipefail
          flutter build linux --release \
            --build-name="$SEMVER_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=YCOMM_VERSION="$APP_VERSION"
      - name: Build .deb package
        run: |
          set -euo pipefail
          BUNDLE="build/linux/x64/release/bundle"
          PKG="build/deb/ycomm_${APP_VERSION}_amd64"
          rm -rf build/deb
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/ycomm" "$PKG/usr/bin" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps"

          # 可执行文件、lib/、data/ 必须放在一起，所以整体装到 /opt/ycomm
          cp -R "$BUNDLE/." "$PKG/opt/ycomm/"
          ln -s /opt/ycomm/ycomm_client "$PKG/usr/bin/ycomm_client"
          install -m 0644 tool/linux/ycomm.desktop "$PKG/usr/share/applications/ycomm.desktop"
          install -m 0644 assets/app_icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/ycomm.png"

          SIZE_KB="$(du -sk "$PKG" | cut -f1)"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: ycomm
          Version: ${APP_VERSION}
          Architecture: amd64
          Maintainer: ${APP_PUBLISHER} <noreply@yanyn.cn>
          Installed-Size: ${SIZE_KB}
          Section: net
          Priority: optional
          Homepage: https://community.yanyn.cn
          Depends: libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0
          Description: ${APP_NAME}桌面客户端
          EOF

          mkdir -p dist
          dpkg-deb --root-owner-group --build "$PKG" "dist/ycomm-linux-${APP_VERSION}.deb"
          dpkg-deb --info "dist/ycomm-linux-${APP_VERSION}.deb"
      - name: Collect artifacts
        run: |
          set -euo pipefail
          BUNDLE="build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "::error::没有找到 Linux bundle"
            find build/linux -maxdepth 4 -type d
            exit 1
          fi
          mkdir -p dist
          tar -czf "dist/ycomm-linux-${APP_VERSION}.tar.gz" -C "$BUNDLE" .
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 7. Web ────────────────────────────────────────────────────────────
  web:
    name: Web
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SEMVER_VERSION: ${{ needs.version.outputs.semver_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inject version into pubspec.yaml
        run: dart tool/set_version.dart "${SEMVER_VERSION}+${BUILD_NUMBER}"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build web
        run: |
          set -euo pipefail
          flutter build web --release \
            --build-name="$SEMVER_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=YCOMM_VERSION="$APP_VERSION"
      - name: Collect artifacts
        run: |
          set -euo pipefail
          # version.json 来自 pubspec.yaml，Service Worker 靠它判断是否需要更新，
          # 版本号必须随发布变化。
          cat build/web/version.json
          grep -q "${SEMVER_VERSION}" build/web/version.json \
            || { echo "::error::version.json 未包含 ${SEMVER_VERSION}"; exit 1; }
          mkdir -p dist
          tar -czf "dist/ycomm-web-${APP_VERSION}.tar.gz" -C build/web .
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 8. Windows：签名（有证书时）+ .zip + 安装包 ───────────────────────
  # 未配置 WINDOWS_CERT_PFX_BASE64 时跳过签名，用户运行安装包会看到
  # SmartScreen「未知发布者」，详见 README 的发布者签名一节。
  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SEMVER_VERSION: ${{ needs.version.outputs.semver_version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      APP_NAME: 晏阳社区
      APP_PUBLISHER: 晏阳技术组
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inject version into pubspec.yaml
        run: dart tool/set_version.dart "$env:SEMVER_VERSION+$env:BUILD_NUMBER"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Windows app
        run: |
          flutter build windows --release `
            --build-name="$env:SEMVER_VERSION" `
            --build-number="$env:BUILD_NUMBER" `
            --dart-define=YCOMM_VERSION="$env:APP_VERSION"
      - name: Sign application binaries
        if: env.HAS_WIN_CERT == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }

          $targets = Get-ChildItem -Path 'build\windows\x64\runner\Release' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' }
          foreach ($t in $targets) {
            Write-Host "signing $($t.Name)"
            & $signtool.FullName sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_CERT_PASSWORD $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "sign failed: $($t.FullName)" }
          }
          Remove-Item $pfx -Force
      - name: Collect artifacts
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path $release)) {
            Write-Error "没有找到 Windows Release 目录"
            exit 1
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\ycomm-windows-$env:APP_VERSION.zip"
          Get-ChildItem dist | Format-Table Name, Length
      - name: Build Windows installer
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
                                  'C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }

          & $iscc.FullName `
            "/DAppName=$env:APP_NAME" `
            "/DAppVersion=$env:APP_VERSION" `
            "/DAppPublisher=$env:APP_PUBLISHER" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            "/DIconFile=$PWD\windows\runner\resources\app_icon.ico" `
            "/DOutputBaseName=ycomm-windows-$env:APP_VERSION-setup" `
            'tool\windows_installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length
      - name: Sign installer
        if: env.HAS_WIN_CERT == 'true'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          & $signtool.FullName sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_CERT_PASSWORD $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "sign failed: $($setup.FullName)" }
          & $signtool.FullName verify /pa /v $setup.FullName
          Remove-Item $pfx -Force
      - name: Warn when unsigned
        if: env.HAS_WIN_CERT != 'true'
        run: |
          Write-Host "::warning::未配置代码签名证书（WINDOWS_CERT_PFX_BASE64），Windows 产物未签名，用户会看到 SmartScreen「未知发布者」。"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ── 9. 打标签 + 创建 GitHub Release ───────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [version, android, ios, macos, linux, web, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.tag }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      SIGNED_WINDOWS: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      SIGNED_MACOS: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先同步远端 tag，避免看不到并发运行刚建好的同名 tag
          git fetch --tags --force origin >/dev/null 2>&1 || true

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION 已存在，跳过创建"
            exit 0
          fi

          git tag "$VERSION"
          for attempt in 1 2 3; do
            if git push origin "refs/tags/$VERSION"; then
              echo "tag $VERSION created"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep 3
          done

          git tag -d "$VERSION" >/dev/null 2>&1 || true
          echo "::error::tag $VERSION 推送失败"
          exit 1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION 不存在，无法创建 Release"
            exit 1
          fi

          {
            echo "## YComm Flutter ${VERSION}"
            echo ""
            echo "版本号：\`${APP_VERSION}\`（yyyy.mm.dd.commits，与 YComm_WebSite 同格式）。"
            echo "发布者：晏阳技术组"
            echo ""
            echo "### 安装包"
            echo ""
            echo "| 平台 | 文件 | 安装方式 |"
            echo "| --- | --- | --- |"
            echo "| Windows | \`ycomm-windows-${APP_VERSION}-setup.exe\` | 双击运行安装向导（按用户安装，不需要管理员权限） |"
            echo "| macOS | \`ycomm-macos-${APP_VERSION}.dmg\` | 打开后把「晏阳社区」拖进「应用程序」 |"
            echo "| Linux | \`ycomm-linux-${APP_VERSION}.deb\` | \`sudo apt install ./ycomm-linux-${APP_VERSION}.deb\` |"
            echo ""
            echo "### 免安装包"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "| --- | --- | --- |"
            echo "| Android | \`ycomm-android-${APP_VERSION}.apk\` | 已签名的 Release APK |"
            echo "| Android | \`ycomm-android-${APP_VERSION}.aab\` | Google Play 上传包 |"
            echo "| iOS | \`ycomm-ios-${APP_VERSION}-unsigned.ipa\` | 未签名 IPA，需自行签名 |"
            echo "| macOS | \`ycomm-macos-${APP_VERSION}.zip\` | \`.app\`，解压即用 |"
            echo "| Linux | \`ycomm-linux-${APP_VERSION}.tar.gz\` | 解压即用，需 webkit2gtk-4.1 |"
            echo "| Web | \`ycomm-web-${APP_VERSION}.tar.gz\` | 静态站点，解压后用任意 Web 服务器托管 |"
            echo "| Windows | \`ycomm-windows-${APP_VERSION}.zip\` | 解压即用，需系统 WebView2 |"
            echo ""
            echo "### 关于安全提示"
            echo ""
            echo "发布者签名为**按平台分别配置**，本次构建的状态："
            echo ""
            echo "| 平台 | 签名状态 | 用户会看到什么 |"
            echo "| --- | --- | --- |"
            if [ "$SIGNED_WINDOWS" = "true" ]; then
              echo "| Windows | ✅ 已用代码签名证书签名 | 安装包属性里能看到发布者「晏阳技术组」 |"
            else
              echo "| Windows | ⚠️ 未签名 | SmartScreen 提示「未知发布者」，需点「更多信息」→「仍要运行」 |"
            fi
            if [ "$SIGNED_MACOS" = "true" ]; then
              echo "| macOS | ✅ 已用 Developer ID 签名并公证 | 可直接打开 |"
            else
              echo "| macOS | ⚠️ 未签名 | Gatekeeper 提示「无法验证开发者」，需右键「打开」或到「系统设置 → 隐私与安全性」放行 |"
            fi
            echo "| Linux | 不适用 | \`.deb\` 没有代码签名机制 |"
            echo ""
            echo "安装包内的发布者信息（程序名、发布者、版本、版权）已经写入 Windows 版本资源、macOS \`Info.plist\` 与 \`.deb\` 的 control 文件；"
            echo "但**弹出安全提示的是操作系统的签名校验，只有配置证书才能真正消除提示**。证书配置方法见仓库 README。"
            echo ""
            echo "校验：\`sha256sum -c SHA256SUMS.txt\`"
          } > release-notes.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "YComm Flutter ${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$VERSION" --title "YComm Flutter ${VERSION}" --notes-file release-notes.md --latest
          fi

          gh release upload "$VERSION" dist/* --clobber
