name: CI

# PR 上的快速反馈：静态分析 + 测试。
# 推送到 main 的完整校验与全平台构建由 Release 工作流负责（见 release.yml）。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  verify:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
